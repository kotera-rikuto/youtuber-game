<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1850" viewBox="0 0 2400 1850" role="img" aria-labelledby="title desc">
  <title id="title">『YouTuberになろう！（仮）』正規化後コアER図</title>
  <desc id="desc">現在状態、プレイヤー入力、確定履歴、読み取りViewを分離した保守性重視のデータベース設計。</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172033}
      .title{font-size:36px;font-weight:700}.subtitle{font-size:17px;fill:#64748b}.group-title{font-size:21px;font-weight:700}.table-title{font-size:20px;font-weight:700}.field{font-size:15px;fill:#334155}.key{font-size:15px;font-weight:700}.hint{font-size:13px;fill:#64748b}.note{font-size:15px;fill:#475569}
      .card{fill:#fff;stroke-width:2;filter:url(#shadow)}.divider{stroke:#e2e8f0;stroke-width:1.5}.rel{fill:none;stroke:#64748b;stroke-width:2.3}.rel-strong{fill:none;stroke:#334155;stroke-width:3}.derived{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7}.cardinal{font-size:13px;font-weight:700;fill:#475569}
    </style>
  </defs>
  <rect width="2400" height="1850" fill="#f8fafc"/>
  <text x="50" y="58" class="title">『YouTuberになろう！（仮）』正規化後コアER図</text>
  <text x="50" y="90" class="subtitle">書き込みモデルは正規化 ｜ 過去結果は変更不能スナップショット ｜ 画面用の横持ちはView</text>

  <!-- zones -->
  <rect x="25" y="120" width="305" height="1640" rx="25" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="48" y="158" class="group-title">アカウント</text>
  <rect x="355" y="120" width="570" height="1640" rx="25" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="380" y="158" class="group-title">ゲーム人生・現在値</text>
  <rect x="950" y="120" width="450" height="1640" rx="25" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/><text x="975" y="158" class="group-title">入力・変更履歴</text>
  <rect x="1425" y="120" width="510" height="1640" rx="25" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text x="1450" y="158" class="group-title">確定済み履歴</text>
  <rect x="1960" y="120" width="415" height="1640" rx="25" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="1985" y="158" class="group-title">実行制御・Rules / Views</text>

  <!-- relations -->
  <path d="M180 280 L180 340" class="rel-strong"/><path d="M300 225 C345 225 345 250 390 250" class="rel-strong"/>
  <path d="M640 440 L640 480" class="rel-strong"/><path d="M520 780 L510 850" class="rel"/><path d="M750 780 L770 850" class="rel"/>
  <path d="M500 780 C470 900 470 1000 510 1100" class="rel"/><path d="M780 780 C820 900 820 1000 770 1100" class="rel"/><path d="M640 780 L640 1370" class="rel"/>
  <path d="M890 300 C940 300 940 270 980 270" class="rel"/><path d="M1175 410 L1175 470" class="rel"/><path d="M1175 410 C1130 520 1130 610 1175 710" class="rel"/>
  <path d="M890 360 C940 520 940 950 980 1030" class="rel"/><path d="M890 390 C940 700 940 1280 980 1300" class="rel"/>
  <path d="M1070 1390 L1070 1450" class="rel"/><path d="M1270 1450 C1320 1390 1320 930 890 930" class="rel"/>
  <path d="M890 650 C1170 650 1240 300 1460 300" class="rel-strong"/><path d="M1190 1150 C1330 1150 1350 370 1460 370" class="rel"/>
  <path d="M1680 490 L1680 550" class="rel-strong"/><path d="M1680 780 L1680 840" class="rel-strong"/><path d="M1680 490 C1770 700 1770 1380 1680 1520" class="rel"/>
  <path d="M1370 305 C1420 400 1400 650 1460 650" class="rel"/><path d="M1680 1260 L1680 780" class="rel"/>
  <path d="M2310 400 C2350 390 2350 235 890 235" class="derived"/>
  <path d="M1900 950 C1970 950 1960 1000 1990 1000" class="derived"/><path d="M890 640 C1900 640 1900 540 1990 540" class="derived"/>

  <!-- account -->
  <rect x="55" y="180" width="245" height="100" rx="15" class="card" stroke="#60a5fa"/><rect x="55" y="180" width="245" height="42" rx="15" fill="#dbeafe"/><text x="75" y="208" class="table-title">auth.users</text><line x1="55" y1="222" x2="300" y2="222" class="divider"/><text x="75" y="250" class="key">PK id : uuid</text><text x="75" y="272" class="hint">開始時に匿名で自動作成</text>
  <rect x="55" y="340" width="245" height="130" rx="15" class="card" stroke="#60a5fa"/><rect x="55" y="340" width="245" height="42" rx="15" fill="#dbeafe"/><text x="75" y="368" class="table-title">profiles</text><line x1="55" y1="382" x2="300" y2="382" class="divider"/><text x="75" y="410" class="key">PK/FK user_id</text><text x="75" y="434" class="field">display_name</text><text x="75" y="458" class="field">created_at</text>
  <text x="55" y="525" class="note">profilesは初期版では任意。</text><text x="55" y="550" class="note">Cookieはセッションだけ保持。</text>

  <!-- run/core -->
  <rect x="390" y="180" width="500" height="260" rx="16" class="card" stroke="#fb923c"/><rect x="390" y="180" width="500" height="44" rx="16" fill="#ffedd5"/><text x="412" y="210" class="table-title">game_runs</text><line x1="390" y1="224" x2="890" y2="224" class="divider"/>
  <text x="412" y="252" class="key">PK id　FK user_id → auth.users.id</text><text x="412" y="278" class="key">FK rule_set_id → rule_sets.id</text><text x="412" y="304" class="key">FK channel_rule_id → channel_rules.id</text><text x="412" y="330" class="key">FK (rule_set_id, specialty_code)?</text><text x="412" y="356" class="field">channel_name / status (+ abandoned)</text><text x="412" y="382" class="field">created_at / completed_at</text><text x="412" y="414" class="hint">専門分野は特化系だけ必須・開始後変更禁止。</text>

  <rect x="390" y="480" width="500" height="300" rx="16" class="card" stroke="#fb923c"/><rect x="390" y="480" width="500" height="44" rx="16" fill="#ffedd5"/><text x="412" y="510" class="table-title">run_state</text><line x1="390" y1="524" x2="890" y2="524" class="divider"/>
  <text x="412" y="552" class="key">PK/FK run_id → game_runs.id</text><text x="412" y="578" class="key">FK posting_frequency_rule_id</text><text x="412" y="604" class="field">current_week (次に処理する週・1以上)</text><text x="412" y="630" class="field">cash / energy / subscribers</text><text x="412" y="656" class="field">cumulative_views / flame_count</text><text x="412" y="682" class="field">state_version / updated_at</text><text x="412" y="708" class="hint">生の乱数・シードは保存しない。</text><text x="412" y="750" class="hint">現在値の正本。1 run = 1 row。</text>

  <rect x="390" y="850" width="240" height="180" rx="15" class="card" stroke="#fb923c"/><rect x="390" y="850" width="240" height="42" rx="15" fill="#ffedd5"/><text x="410" y="878" class="table-title">run_abilities</text><line x1="390" y1="892" x2="630" y2="892" class="divider"/><text x="410" y="920" class="key">PK run_id + ability_code</text><text x="410" y="946" class="field">value : 0..100</text><text x="410" y="982" class="hint">能力追加で列追加不要。</text>
  <rect x="650" y="850" width="240" height="180" rx="15" class="card" stroke="#fb923c"/><rect x="650" y="850" width="240" height="42" rx="15" fill="#ffedd5"/><text x="670" y="878" class="table-title">run_equipment</text><line x1="650" y1="892" x2="890" y2="892" class="divider"/><text x="670" y="920" class="key">PK run_id + type_code</text><text x="670" y="946" class="field">FK tier_rule_id</text><text x="670" y="972" class="field">acquired_week</text>
  <rect x="390" y="1100" width="240" height="200" rx="15" class="card" stroke="#fb923c"/><rect x="390" y="1100" width="240" height="42" rx="15" fill="#ffedd5"/><text x="410" y="1128" class="table-title">run_feature_unlocks</text><line x1="390" y1="1142" x2="630" y2="1142" class="divider"/><text x="410" y="1170" class="key">PK run_id + feature_rule</text><text x="410" y="1196" class="field">unlocked_week</text><text x="410" y="1222" class="field">active_from_week</text><text x="410" y="1260" class="hint">解放後は行を削除しない。</text>
  <rect x="650" y="1100" width="240" height="200" rx="15" class="card" stroke="#fb923c"/><rect x="650" y="1100" width="240" height="42" rx="15" fill="#ffedd5"/><text x="670" y="1128" class="table-title">run_goals</text><line x1="650" y1="1142" x2="890" y2="1142" class="divider"/><text x="670" y="1170" class="key">PK id　FK run_id</text><text x="670" y="1196" class="field">FK goal_rule_id</text><text x="670" y="1222" class="field">start / deadline / achieved</text><text x="670" y="1248" class="field">status</text>
  <rect x="390" y="1370" width="500" height="200" rx="15" class="card" stroke="#fb923c"/><rect x="390" y="1370" width="500" height="42" rx="15" fill="#ffedd5"/><text x="412" y="1398" class="table-title">run_conditions</text><line x1="390" y1="1412" x2="890" y2="1412" class="divider"/><text x="412" y="1440" class="key">PK id　FK run_id / health_risk_rule_id</text><text x="412" y="1466" class="field">started_week / duration_weeks</text><text x="412" y="1492" class="field">unavailable_from / through / recovered_at?</text><text x="412" y="1530" class="hint">共通の体調不良。翌週から活動不能。</text>

  <!-- input -->
  <rect x="980" y="180" width="390" height="230" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="180" width="390" height="42" rx="15" fill="#f3e8ff"/><text x="1002" y="208" class="table-title">player_ideas</text><line x1="980" y1="222" x2="1370" y2="222" class="divider"/><text x="1002" y="250" class="key">PK id　FK run_id</text><text x="1002" y="276" class="field">title / description?</text><text x="1002" y="302" class="field">created_week / created_at</text><text x="1002" y="328" class="field">deleted_at?</text><text x="1002" y="370" class="hint">status・published_weekは持たない。</text>
  <rect x="980" y="470" width="390" height="180" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="470" width="390" height="42" rx="15" fill="#f3e8ff"/><text x="1002" y="498" class="table-title">idea_evaluations</text><line x1="980" y1="512" x2="1370" y2="512" class="divider"/><text x="1002" y="540" class="key">PK/FK idea_id</text><text x="1002" y="566" class="field">score / evaluation_status</text><text x="1002" y="592" class="field">model / prompt_version / evaluated_at</text><text x="1002" y="625" class="hint">倍率はルール表から算出。</text>
  <rect x="980" y="710" width="390" height="180" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="710" width="390" height="42" rx="15" fill="#f3e8ff"/><text x="1002" y="738" class="table-title">idea_queue_entries</text><line x1="980" y1="752" x2="1370" y2="752" class="divider"/><text x="1002" y="780" class="key">PK/FK idea_id　FK run_id</text><text x="1002" y="806" class="field">position / queued_at</text><text x="1002" y="842" class="key">UQ (run_id, position)</text><text x="1002" y="870" class="hint">投稿・削除時に行を除去。</text>
  <rect x="980" y="950" width="390" height="200" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="950" width="390" height="42" rx="15" fill="#f3e8ff"/><text x="1002" y="978" class="table-title">weekly_actions</text><line x1="980" y1="992" x2="1370" y2="992" class="divider"/><text x="1002" y="1020" class="key">PK id　FK run_id / action_rule_id</text><text x="1002" y="1046" class="field">week_number / selected_at</text><text x="1002" y="1072" class="field">locked_at?</text><text x="1002" y="1108" class="key">UQ (run_id, week_number)</text>
  <rect x="980" y="1210" width="390" height="180" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="1210" width="390" height="42" rx="15" fill="#f3e8ff"/><text x="1002" y="1238" class="table-title">ability_point_grants</text><line x1="980" y1="1252" x2="1370" y2="1252" class="divider"/><text x="1002" y="1280" class="key">PK id　FK run_id</text><text x="1002" y="1306" class="field">earned_week / available_from_week</text><text x="1002" y="1332" class="field">amount / status</text><text x="1002" y="1368" class="hint">使用量はallocationsのSUMで算出。</text>
  <rect x="980" y="1450" width="185" height="190" rx="15" class="card" stroke="#c084fc"/><rect x="980" y="1450" width="185" height="42" rx="15" fill="#f3e8ff"/><text x="994" y="1478" class="table-title">ability_allocations</text><line x1="980" y1="1492" x2="1165" y2="1492" class="divider"/><text x="994" y="1520" class="key">PK id</text><text x="994" y="1546" class="field">FK grant_id</text><text x="994" y="1572" class="field">ability_code / points</text><text x="994" y="1598" class="field">allocated_week</text>
  <rect x="1185" y="1450" width="185" height="190" rx="15" class="card" stroke="#c084fc"/><rect x="1185" y="1450" width="185" height="42" rx="15" fill="#f3e8ff"/><text x="1198" y="1478" class="table-title">equipment_purchases</text><line x1="1185" y1="1492" x2="1370" y2="1492" class="divider"/><text x="1198" y="1520" class="key">PK id　FK run_id</text><text x="1198" y="1546" class="field">from / to tier rule</text><text x="1198" y="1572" class="field">price_paid</text><text x="1198" y="1598" class="field">purchased_week</text>

  <!-- history -->
  <rect x="1460" y="180" width="440" height="310" rx="15" class="card" stroke="#4ade80"/><rect x="1460" y="180" width="440" height="42" rx="15" fill="#dcfce7"/><text x="1482" y="208" class="table-title">week_results</text><line x1="1460" y1="222" x2="1900" y2="222" class="divider"/><text x="1482" y="250" class="key">PK id　FK execution_id / run_id</text><text x="1482" y="276" class="field">week_number / action / posting rule</text><text x="1482" y="302" class="field">views_before_event / final_views</text><text x="1482" y="328" class="field">subscribers_before / peak / after</text><text x="1482" y="354" class="field">energy_before / after</text><text x="1482" y="380" class="field">cash_before / after / ad_revenue</text><text x="1482" y="406" class="field">flame_count_after</text><text x="1482" y="432" class="field">run_status_after / state_version_after</text><text x="1482" y="468" class="key">UQ (run_id, week_number)</text>
  <rect x="1460" y="550" width="440" height="230" rx="15" class="card" stroke="#4ade80"/><rect x="1460" y="550" width="440" height="42" rx="15" fill="#dcfce7"/><text x="1482" y="578" class="table-title">videos</text><line x1="1460" y1="592" x2="1900" y2="592" class="divider"/><text x="1482" y="620" class="key">PK id　FK week_result_id</text><text x="1482" y="646" class="field">sequence_number / title_snapshot</text><text x="1482" y="672" class="field">FK player_idea? / system_cycle_entry?</text><text x="1482" y="708" class="key">CHECK: 企画参照は片方だけ</text><text x="1482" y="734" class="hint">各企画・cycle entryは最大1動画。</text>
  <rect x="1460" y="840" width="440" height="360" rx="15" class="card" stroke="#4ade80"/><rect x="1460" y="840" width="440" height="42" rx="15" fill="#dcfce7"/><text x="1482" y="868" class="table-title">video_calculations</text><line x1="1460" y1="882" x2="1900" y2="882" class="divider"/><text x="1482" y="910" class="key">PK/FK video_id</text><text x="1482" y="936" class="field">base_views</text><text x="1482" y="962" class="field">subscriber / ability / idea multipliers</text><text x="1482" y="988" class="field">posting / channel / equipment multipliers</text><text x="1482" y="1014" class="field">collaboration_multiplier</text><text x="1482" y="1040" class="field">views_before_event / event_multiplier</text><text x="1482" y="1066" class="field">final_views</text><text x="1482" y="1092" class="field">conversion_rate / subscribers_gained</text><text x="1482" y="1140" class="hint">変更不能な計算根拠スナップショット。</text>
  <rect x="1460" y="1260" width="440" height="200" rx="15" class="card" stroke="#4ade80"/><rect x="1460" y="1260" width="440" height="42" rx="15" fill="#dcfce7"/><text x="1482" y="1288" class="table-title">system_idea_cycles + entries</text><line x1="1460" y1="1302" x2="1900" y2="1302" class="divider"/><text x="1482" y="1330" class="key">cycle: run_id / cycle_number</text><text x="1482" y="1356" class="field">entry: system_idea_rule_id / position 1..50</text><text x="1482" y="1392" class="key">UQ cycle + idea / cycle + position</text><text x="1482" y="1420" class="hint">特化系は選択専門分野の50件だけで一巡。</text>
  <rect x="1460" y="1520" width="210" height="190" rx="15" class="card" stroke="#4ade80"/><rect x="1460" y="1520" width="210" height="42" rx="15" fill="#dcfce7"/><text x="1474" y="1548" class="table-title">occurred_events</text><line x1="1460" y1="1562" x2="1670" y2="1562" class="divider"/><text x="1474" y="1590" class="key">PK id / FK week</text><text x="1474" y="1616" class="field">definition / rule</text><text x="1474" y="1642" class="field">sequence / metadata?</text><text x="1474" y="1680" class="hint">確定週のイベント。</text>
  <rect x="1690" y="1520" width="210" height="190" rx="15" class="card" stroke="#4ade80"/><rect x="1690" y="1520" width="210" height="42" rx="15" fill="#dcfce7"/><text x="1704" y="1548" class="table-title">game_terminations</text><line x1="1690" y1="1562" x2="1900" y2="1562" class="divider"/><text x="1704" y="1590" class="key">UQ run_id</text><text x="1704" y="1616" class="field">execution? / week_result?</text><text x="1704" y="1642" class="field">reason / occurred_week</text><text x="1704" y="1680" class="hint">死亡・BAN・期限・中断。</text>

  <!-- rules/views -->
  <rect x="1990" y="180" width="350" height="220" rx="15" class="card" stroke="#94a3b8"/><rect x="1990" y="180" width="350" height="42" rx="15" fill="#e2e8f0"/><text x="2012" y="208" class="table-title">rule_sets + typed rules</text><line x1="1990" y1="222" x2="2340" y2="222" class="divider"/><text x="2012" y="250" class="key">rule_sets.id</text><text x="2012" y="276" class="field">channel / specialty / posting / action</text><text x="2012" y="302" class="field">goal / feature / event / health</text><text x="2012" y="328" class="field">idea score bands / global rules</text><text x="2012" y="366" class="hint">詳細は RULES_ERD.svg を参照。</text>
  <rect x="1990" y="480" width="350" height="130" rx="15" class="card" stroke="#94a3b8"/><rect x="1990" y="480" width="350" height="42" rx="15" fill="#e2e8f0"/><text x="2012" y="508" class="table-title">current_game_view</text><text x="2012" y="552" class="field">種類・専門分野＋現在値＋能力＋機材</text><text x="2012" y="582" class="hint">更新禁止 / security_invoker</text>
  <rect x="1990" y="670" width="350" height="130" rx="15" class="card" stroke="#94a3b8"/><rect x="1990" y="670" width="350" height="42" rx="15" fill="#e2e8f0"/><text x="2012" y="698" class="table-title">idea_stock_view</text><text x="2012" y="742" class="field">企画原本＋キュー順</text><text x="2012" y="772" class="hint">AI点数は公開列から除外</text>
  <rect x="1990" y="860" width="350" height="130" rx="15" class="card" stroke="#94a3b8"/><rect x="1990" y="860" width="350" height="42" rx="15" fill="#e2e8f0"/><text x="2012" y="888" class="table-title">week_history_view</text><text x="2012" y="932" class="field">before/afterから差分を計算</text><text x="2012" y="962" class="hint">履歴テーブルへ差分列を重複保存しない</text>
  <rect x="1990" y="1050" width="350" height="130" rx="15" class="card" stroke="#94a3b8"/><rect x="1990" y="1050" width="350" height="42" rx="15" fill="#e2e8f0"/><text x="2012" y="1078" class="table-title">video_result_view</text><text x="2012" y="1122" class="field">動画＋計算スナップショット</text><text x="2012" y="1152" class="hint">表示DTO向け</text>
  <rect x="1990" y="1260" width="350" height="300" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="2012" y="1300" class="table-title">advance_week_executions</text><text x="2012" y="1340" class="key">PK idempotency_key</text><text x="2012" y="1372" class="field">FK run_id / attempted_week</text><text x="2012" y="1404" class="field">expected_state_version</text><text x="2012" y="1436" class="field">outcome / created_at</text><text x="2012" y="1478" class="hint">再送は同じ週結果または</text><text x="2012" y="1502" class="hint">終了結果を返す。</text><text x="2012" y="1536" class="hint">DB関数の1 transactionで作成。</text>

  <rect x="45" y="1780" width="2310" height="46" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="68" y="1809" class="note">重要：横持ちの current_game_view は読み取りモデル。更新は game_runs / run_state / 正規化された子テーブルだけに行う。</text>
</svg>
